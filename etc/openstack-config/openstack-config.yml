openstack_admin_roles:
  - admin

openstack_unlimited_quotas:
  backup_gigabytes: -1
  backups: -1
  cores: -1
  floatingip: -1
  gigabytes: -1
  injected_file_size: -1
  injected_files: -1
  instances: -1
  key_pairs: -1
  per_volume_gigabytes: -1
  ram: -1
  security_group: -1
  security_group_rule: -1
  snapshots: -1
  volumes: -1

openstack_flavors:
  - "{{ openstack_flavor_m1_tiny }}"
  - "{{ openstack_flavor_m1_small }}"
  - "{{ openstack_flavor_m1_medium }}"
  - "{{ openstack_flavor_m1_large }}"
  - "{{ openstack_flavor_m1_xlarge }}"
  - "{{ openstack_flavor_m1_xxlarge }}"

openstack_flavor_m1_tiny:
  name: "m1.tiny"
  ram: 512
  disk: 16
  vcpus: 1

openstack_flavor_m1_small:
  name: "m1.small"
  ram: 2048
  disk: 32
  vcpus: 2

openstack_flavor_m1_medium:
  name: "m1.medium"
  ram: 4096
  disk: 64
  vcpus: 4

openstack_flavor_m1_large:
  name: "m1.large"
  ram: 8192
  disk: 64
  vcpus: 4

openstack_flavor_m1_xlarge:
  name: "m1.xlarge"
  ram: 16384
  disk: 64
  vcpus: 8

openstack_flavor_m1_xxlarge:
  name: "m1.xxlarge"
  ram: 32768
  disk: 64
  vcpus: 8

openstack_images:
  - "{{ openstack_image_cirros_0_6_3 }}"
  - "{{ openstack_image_ubuntu_2204 }}"
  - "{{ openstack_image_ubuntu_2404 }}"

openstack_image_cirros_0_6_3:
  name: "Cirros 6.3"
  type: qcow2
  image_url: "https://github.com/cirros-dev/cirros/releases/download/0.6.3/cirros-0.6.3-x86_64-disk.img"
  is_public: True
  properties:
    os_type: "linux"
    os_distro: "cirros"
    os_version: "0.6.3"
    hw_rng_model: "virtio"
    hw_scsi_model: virtio-scsi
    hw_disk_bus: scsi

openstack_image_ubuntu_2204:
  name: "Ubuntu 22.04"
  type: qcow2
  image_url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
  is_public: True
  properties:
    os_type: "linux"
    os_distro: "ubuntu"
    os_version: "22.04"
    hw_rng_model: "virtio"
    hw_scsi_model: "virtio-scsi"
    hw_disk_bus: "scsi"
    hw_qemu_guest_agent: "yes"
    os_require_quiesce: "yes"

openstack_image_ubuntu_2404:
  name: "Ubuntu 24.04"
  type: qcow2
  image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
  is_public: true
  properties:
    os_type: "linux"
    os_distro: "ubuntu"
    os_version: "24.04"
    hw_rng_model: "virtio"
    hw_scsi_model: "virtio-scsi"
    hw_disk_bus: "scsi"
    hw_qemu_guest_agent: "yes"
    os_require_quiesce: "yes"

openstack_networks:
  - "{{ openstack_network_external }}"
  - "{{ openstack_network_admin_vlan }}"
  - "{{ openstack_network_compute_vlan }}"
#  - "{{ openstack_network_external_v6 }}"

openstack_network_external_name: "external"

openstack_network_external:
  name: "{{ openstack_network_external_name }}"
  project: "admin"
  provider_network_type: "vlan"
  provider_physical_network: "physnet1"
  provider_segmentation_id: 140
  shared: true
  external: true
  subnets:
    - "{{ openstack_subnet_external }}"

openstack_subnet_external:
  name: "{{ openstack_network_external_name }}"
  project: "admin"
  cidr: "10.100.40.0/24"
  gateway_ip: "10.100.40.254"
  allocation_pool_start: "10.100.40.200"
  allocation_pool_end: "10.100.40.249"

openstack_network_admin_vlan_name: "admin-vlan"

openstack_network_admin_vlan:
  name: "{{ openstack_network_admin_vlan_name }}"
  project: admin
  provider_network_type: "vlan"
  provider_physical_network: "physnet1"
  shared: false
  subnets:
    - "{{ openstack_subnet_admin_vlan }}"

openstack_subnet_admin_vlan:
  name: "{{ openstack_network_admin_vlan_name }}"
  project: admin
  cidr: "172.24.0.0/24"
  gateway_ip: "172.24.0.254"
  allocation_pool_start: "172.24.0.1"
  allocation_pool_end: "172.24.0.253"

