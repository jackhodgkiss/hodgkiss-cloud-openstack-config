openstack_routers:
  - "{{ openstack_router_admin }}"
  - "{{ openstack_router_compute }}"

openstack_router_admin:
  - name: admin
    project: admin
    interfaces:
      - "{{ openstack_network_admin_vlan_name }}"
    network: "{{ openstack_network_external_name }}"

openstack_network_compute_vlan_name: "compute-vlan"

openstack_network_compute_vlan:
  name: "{{ openstack_network_compute_vlan_name }}"
  project: compute
  provider_network_type: "vlan"
  provider_physical_network: "physnet1"
  shared: false
  subnets:
    - "{{ openstack_subnet_compute_vlan }}"

openstack_subnet_compute_vlan:
  name: "{{ openstack_network_compute_vlan_name }}"
  project: compute
  cidr: "10.141.0.0/24"
  gateway_ip: "10.141.0.254"
  allocation_pool_start: "10.141.0.1"
  allocation_pool_end: "10.141.0.253"

openstack_router_compute:
  - name: compute
    project: compute
    interfaces:
      - "{{ openstack_network_compute_vlan_name }}"
    network: "{{ openstack_network_external_name }}"

openstack_security_groups:
  - name: default
    project: admin
    rules:
      - protocol: icmp
      - protocol: tcp
        port_range_min: 22
        port_range_max: 22
      - protocol: ipv6-icmp
        ethertype: IPv6
  - name: default
    project: compute
    rules:
      - protocol: icmp
      - protocol: tcp
        port_range_min: 22
        port_range_max: 22
      - protocol: ipv6-icmp
        ethertype: IPv6
